name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --all-extras
      - run: uv run --no-sync playwright install --with-deps chromium
      - run: uv run --no-sync ruff check src tests
      - run: uv run --no-sync basedpyright
      - run: uv run --no-sync pytest -q
      - run: uv build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
          attestations: false
      - id: release
        uses: softprops/action-gh-release@v2
        with:
          name: Tavola ${{ github.ref_name }}
          body: |
            One source, one designed infographic.

            macOS builds are signed and notarized. Windows and Linux builds are
            unsigned for now. The Python wheel and source distribution are
            attached, and the package is on PyPI.
          files: dist/*.whl dist/*.tar.gz

  desktop:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: ""
            args: ""
          - platform: ubuntu-22.04
            target: ""
            args: --bundles appimage,deb
    runs-on: ${{ matrix.platform }}
    # The canonical Apple secrets, as app-hq/scripts/sync-apple-secrets.sh sets them.
    # Tauri's bundler imports APPLE_CERTIFICATE and notarizes with APPLE_API_KEY_PATH.
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
    steps:
      - uses: actions/checkout@v5
      - if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Rust (targeted)
        if: matrix.target != ''
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Rust (host)
        if: matrix.target == ''
        uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            desktop/src-tauri -> target
      # Writes the App Store Connect key from APPLE_API_KEY_CONTENT and checks that
      # every canonical Apple secret is present before anything is built.
      - uses: michael-borck/app-hq/.github/actions/apple-signing@main
        if: runner.os == 'macOS'
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          releaseId: ${{ needs.prepare.outputs.release_id }}
          includeUpdaterJson: false
          tauriScript: npx --yes @tauri-apps/cli@^2
          args: ${{ matrix.args }}
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        run: |
          DMG=$(ls "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/"*.dmg | head -1)
          MNT=$(mktemp -d)
          trap 'hdiutil detach "$MNT" >/dev/null 2>&1 || true' EXIT
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MNT" >/dev/null
          APP=$(ls -d "$MNT"/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=4 "$APP"
          for attempt in 1 2 3; do
            xcrun stapler validate "$APP" && break
            [ "$attempt" -eq 3 ] && exit 1
            echo "stapler validate failed (attempt $attempt); retrying..."
            sleep 15
          done
