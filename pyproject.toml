[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tavola"
version = "0.1.0"
description = "Turn a source into one well-designed infographic. Bring your own LLM."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Michael Borck", email = "michael.borck@curtin.edu.au" },
]
keywords = [
    "ai",
    "infographic",
    "visualization",
    "notebooklm",
    "byok",
    "cli",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Text Processing :: Markup :: HTML",
]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pyyaml>=6.0.0",
    "pydantic>=2.7.0",
    "requests>=2.31.0",
    "pypdf>=4.2.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
render = [
    "playwright>=1.44.0",
]
serve = [
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9",
]
docx = [
    "python-docx>=1.1.0",
]
dev = [
    "basedpyright>=1.29.4",
    "build>=1.2.2",
    "fastapi>=0.110.0",
    "httpx>=0.27.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.12.0",
    "twine>=6.1.0",
    "uvicorn>=0.29.0",
]

[project.scripts]
tavola = "tavola.cli:app"

[project.urls]
Homepage = "https://github.com/michael-borck/tavola"
Repository = "https://github.com/michael-borck/tavola"
Issues = "https://github.com/michael-borck/tavola/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tavola"]

[tool.hatch.build.targets.wheel.force-include]
"src/tavola/serve_page.html" = "tavola/serve_page.html"

[tool.hatch.build.targets.sdist]
exclude = [
    "desktop",
    ".github",
    "dist",
    ".pytest_cache",
    ".ruff_cache",
    "**/._*",
]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = ["**/._*"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["tavola"]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", "**/._*"]
pythonVersion = "3.10"
pythonPlatform = "All"
typeCheckingMode = "basic"
reportMissingImports = true
reportMissingTypeStubs = false
reportUnusedImport = true
reportUnusedClass = true
reportUnusedFunction = true
reportUnusedVariable = true
reportDuplicateImport = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py", "*_test.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=tavola",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["tavola"]
branch = true
